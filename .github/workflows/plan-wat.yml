name: Synchronizacja PLAN WAT (na żądanie)

# Osobisty kalendarz „PLAN WAT” (ta sama zawartość co plan WIG23IX2S1, z zajęciami usuwanymi
# ręcznie). Synchronizuje się tylko z przycisku „Run workflow” — w gcalsync.config.json plan ma
# "manual_only": true, więc cykliczny sync.yml i zewnętrzny wyzwalacz go pomijają.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Zapisz zmiany w kalendarzu (odznaczone = tylko dry-run)"
        type: boolean
        default: true
      reset:
        description: "Wyzeruj kalendarz: przywróć wszystkie usunięte zajęcia i nadpisz ręczne zmiany (odznaczone = zachowaj je)"
        type: boolean
        default: true
      allow_mass_delete:
        description: "Pozwól na zapis mimo bezpiecznika masowego usuwania"
        type: boolean
        default: false

# Osobna kolejka niż sync.yml: w jednej grupie czekające uruchomienie jest zastępowane nowszym,
# więc częsty sync.yml mógłby anulować czekające uruchomienie tego workflow.
concurrency:
  group: gcalsync-plan-wat
  cancel-in-progress: false

permissions:
  contents: write # tylko do zapisu ID nowo utworzonego kalendarza w gcalsync.config.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # do git pull --rebase przy zapisie ID nowego kalendarza

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: |
          python -m pip install --quiet uv
          uv sync --frozen --no-dev

      - name: Synchronizacja
        env:
          EWIG_LOGIN: ${{ secrets.EWIG_LOGIN }}
          EWIG_PASSWORD: ${{ secrets.EWIG_PASSWORD }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          MODE: ${{ inputs.apply && '--apply' || '' }}
          RESET: ${{ inputs.reset && '--reset' || '' }}
          MASS: ${{ inputs.allow_mass_delete && '--allow-mass-delete' || '' }}
        run: uv run --frozen --no-dev gcalsync auto --plan "PLAN WAT" $MODE $RESET $MASS --save-dir run-output --summary "$GITHUB_STEP_SUMMARY"

      - name: Zapis ID nowego kalendarza w konfiguracji
        if: always()
        run: |
          if git diff --quiet -- gcalsync.config.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Konfiguracja: ID kalendarza PLAN WAT" -- gcalsync.config.json
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "::error::Nie udało się zapisać ID kalendarza w repozytorium — dopisz je ręcznie."
          exit 1

      - name: Pliki z ewig i dziennik (7 dni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcalsync-plan-wat-${{ github.run_id }}
          path: run-output
          retention-days: 7
          if-no-files-found: ignore
