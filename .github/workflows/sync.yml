name: Synchronizacja planu

on:
  schedule:
    # 0:00, 6:00, 12:00 i 18:00 czasu polskiego. Cron działa w UTC, a Polska ma +1 zimą
    # i +2 latem, więc uruchamiamy się w obu kandydackich godzinach UTC, a krok „Pora
    # uruchomienia” przepuszcza tylko tę, która w Warszawie wypada o 0, 6, 12 lub 18.
    # Przy braku zmian synchronizacja niczego nie zapisuje.
    # Zapis z uruchomień cyklicznych tylko, gdy w gcalsync.config.json jest "auto_apply": true.
    - cron: "0 4,5,10,11,16,17,22,23 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Zapisz zmiany w kalendarzu (odznaczone = tylko dry-run)"
        type: boolean
        default: false
      allow_mass_delete:
        description: "Pozwól na zapis mimo bezpiecznika masowego usuwania"
        type: boolean
        default: false
      restore_deleted:
        description: "Przywróć zajęcia usunięte ręcznie z kalendarza (razem z zapisem)"
        type: boolean
        default: false

concurrency:
  group: gcalsync
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # tylko do podtrzymania harmonogramu (ostatni krok)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pora uruchomienia
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$(TZ=Europe/Warsaw date +%H)
          if [ "$EVENT" != "schedule" ] || [ $((10#$hour % 6)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "W Warszawie jest ${hour}:xx — to nie jest 0, 6, 12 ani 18. Pomijam."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Instalacja
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --quiet uv
          uv sync --frozen --no-dev

      - name: Synchronizacja
        if: steps.gate.outputs.run == 'true'
        env:
          EWIG_LOGIN: ${{ secrets.EWIG_LOGIN }}
          EWIG_PASSWORD: ${{ secrets.EWIG_PASSWORD }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          MODE: ${{ github.event_name == 'schedule' && '--apply-if-enabled' || (inputs.apply && '--apply' || '') }}
          MASS: ${{ inputs.allow_mass_delete && '--allow-mass-delete' || '' }}
          RESTORE: ${{ inputs.restore_deleted && '--restore-deleted' || '' }}
        run: uv run --frozen --no-dev gcalsync auto $MODE $MASS $RESTORE --save-dir run-output --summary "$GITHUB_STEP_SUMMARY"

      - name: Pliki z ewig i dziennik (7 dni)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gcalsync-${{ github.run_id }}
          path: run-output
          retention-days: 7
          if-no-files-found: ignore

      # W publicznym repo GitHub wyłącza harmonogram po 60 dniach bez aktywności w repo.
      # Ponowne „włączenie” workflow przez API zeruje ten licznik — bez sztucznych commitów.
      - name: Podtrzymanie harmonogramu
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --silent -X PUT "repos/$REPO/actions/workflows/sync.yml/enable"
