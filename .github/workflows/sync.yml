name: Synchronizacja planu

on:
  schedule:
    # Co 30 minut (minuty 17 i 47 UTC, poza szczytem o pełnych godzinach). GitHub nie gwarantuje
    # uruchomień z harmonogramu — bywają opóźnione o kilka godzin albo pomijane (8–17.11.2026
    # odbywało się ok. 2–3 z 8 zaplanowanych dziennie; 17.11 zmiana planu z ok. 1:00–4:00 czekała
    # ponad 9 h, bo terminy 4:17 i 5:17 przepadły). Gęsty harmonogram sprawia, że mimo to
    # uruchomień jest kilkanaście na dobę. Uruchomienie bez zmian w planie trwa ok. 40 s
    # i zapisuje w kalendarzu tylko techniczne zdarzenie stanu (czas ostatniej synchronizacji).
    # Niezależnie od GitHuba można dodać zewnętrzny wyzwalacz — patrz README („Zewnętrzny
    # wyzwalacz”) i opcja `scheduled` niżej.
    # Zapis z uruchomień cyklicznych tylko, gdy w gcalsync.config.json jest "auto_apply": true.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Zapisz zmiany w kalendarzu (odznaczone = tylko dry-run)"
        type: boolean
        default: false
      allow_mass_delete:
        description: "Pozwól na zapis mimo bezpiecznika masowego usuwania"
        type: boolean
        default: false
      restore_deleted:
        description: "Przywróć zajęcia usunięte ręcznie z kalendarza (razem z zapisem)"
        type: boolean
        default: false
      refresh_ewiglookup:
        description: "Odśwież stronę EWIGLookup także bez zmian w kalendarzu (np. test tokenu)"
        type: boolean
        default: false
      scheduled:
        description: "Jak uruchomienie z harmonogramu (zapis wg auto_apply, tolerancja awarii ewig) — dla zewnętrznego wyzwalacza"
        type: boolean
        default: false

concurrency:
  group: gcalsync
  cancel-in-progress: false

permissions:
  contents: write # tylko do zapisu ID nowo utworzonego kalendarza w gcalsync.config.json
  actions: write # tylko do podtrzymania harmonogramu (ostatni krok)

jobs:
  sync:
    runs-on: ubuntu-latest
    # Z ponowieniem po awarii ewig (5 min przerwy) uruchomienie może trwać dłużej.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # do git pull --rebase przy zapisie ID nowego kalendarza

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: |
          python -m pip install --quiet uv
          uv sync --frozen --no-dev

      - name: Synchronizacja
        id: sync
        env:
          EWIG_LOGIN: ${{ secrets.EWIG_LOGIN }}
          EWIG_PASSWORD: ${{ secrets.EWIG_PASSWORD }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          # Uruchomienie cykliczne: z harmonogramu GitHuba albo z zewnętrznego wyzwalacza
          # (workflow_dispatch z scheduled=true). Zapisuje tylko przy "auto_apply": true.
          MODE: ${{ (github.event_name == 'schedule' || inputs.scheduled == true) && '--apply-if-enabled' || (inputs.apply && '--apply' || '') }}
          MASS: ${{ inputs.allow_mass_delete && '--allow-mass-delete' || '' }}
          RESTORE: ${{ inputs.restore_deleted && '--restore-deleted' || '' }}
          # Uruchomienia cykliczne: gdy ewig nie działa, jeszcze 1 próba po 5 minutach (następne
          # uruchomienie i tak jest za ok. pół godziny); awaria krótsza niż doba od ostatniej
          # udanej synchronizacji nie jest błędem (bez e-maila).
          OUTAGE: ${{ (github.event_name == 'schedule' || inputs.scheduled == true) && '--ewig-retries 1 --ewig-retry-wait 300 --tolerate-ewig-outage 24' || '' }}
        run: uv run --frozen --no-dev gcalsync auto $MODE $MASS $RESTORE $OUTAGE --save-dir run-output --summary "$GITHUB_STEP_SUMMARY" --outputs "$GITHUB_OUTPUT"

      - name: Zapis ID nowego kalendarza w konfiguracji
        if: always()
        run: |
          if git diff --quiet -- gcalsync.config.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Konfiguracja: ID nowo utworzonego kalendarza" -- gcalsync.config.json
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "::error::Nie udało się zapisać ID kalendarza w repozytorium — dopisz je ręcznie."
          exit 1

      # Gdy zajęcia w kalendarzu się zmieniły, od razu odśwież stronę EWIGLookup (zakładki
      # z planami naszych grup czytają te kalendarze). Token z innego repozytorium jest potrzebny,
      # bo GITHUB_TOKEN nie może uruchamiać workflow w EWIGLookup — patrz README.
      - name: Odświeżenie strony EWIGLookup
        if: always() && (steps.sync.outputs.changed == 'true' || inputs.refresh_ewiglookup == true)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.EWIGLOOKUP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Brak sekretu EWIGLOOKUP_TOKEN — strona EWIGLookup odświeży się dopiero z własnego harmonogramu."
            echo "⚠️ EWIGLookup: brak sekretu EWIGLOOKUP_TOKEN." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh workflow run pages.yml -R JBerlinski/EWIGLookup; then
            echo "✅ Uruchomiono „Aktualizacja planów” w EWIGLookup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Nie udało się uruchomić EWIGLookup — token EWIGLOOKUP_TOKEN wygasł albo nie ma uprawnienia Actions: write do EWIGLookup."
            echo "❌ EWIGLookup: token EWIGLOOKUP_TOKEN wygasł albo nie ma uprawnień (Actions: Read and write)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Pliki z ewig i dziennik (7 dni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcalsync-${{ github.run_id }}
          path: run-output
          retention-days: 7
          if-no-files-found: ignore

      # W publicznym repo GitHub wyłącza harmonogram po 60 dniach bez aktywności w repo.
      # Ponowne „włączenie” workflow przez API zeruje ten licznik — bez sztucznych commitów.
      - name: Podtrzymanie harmonogramu
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --silent -X PUT "repos/$REPO/actions/workflows/sync.yml/enable"
