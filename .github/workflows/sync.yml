name: Synchronizacja planu

on:
  schedule:
    # Co pełną godzinę (UTC, ale przesunięcie Polski to pełne godziny, więc wypada o pełnej
    # godzinie także w Warszawie). Przy braku zmian synchronizacja niczego nie zapisuje.
    # Zapis z uruchomień cyklicznych tylko, gdy w gcalsync.config.json jest "auto_apply": true.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Zapisz zmiany w kalendarzu (odznaczone = tylko dry-run)"
        type: boolean
        default: false
      allow_mass_delete:
        description: "Pozwól na zapis mimo bezpiecznika masowego usuwania"
        type: boolean
        default: false

concurrency:
  group: gcalsync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: |
          python -m pip install --quiet uv
          uv sync --frozen --no-dev

      - name: Synchronizacja
        env:
          EWIG_LOGIN: ${{ secrets.EWIG_LOGIN }}
          EWIG_PASSWORD: ${{ secrets.EWIG_PASSWORD }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          MODE: ${{ github.event_name == 'schedule' && '--apply-if-enabled' || (inputs.apply && '--apply' || '') }}
          MASS: ${{ inputs.allow_mass_delete && '--allow-mass-delete' || '' }}
        run: uv run --frozen --no-dev gcalsync auto $MODE $MASS --save-dir run-output --summary "$GITHUB_STEP_SUMMARY"

      - name: Pliki z ewig i dziennik (7 dni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcalsync-${{ github.run_id }}
          path: run-output
          retention-days: 7
          if-no-files-found: ignore
