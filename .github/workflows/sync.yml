name: Synchronizacja planu

on:
  schedule:
    # Okolice 0:00, 6:00, 12:00 i 18:00 czasu polskiego: cron działa w UTC, a Polska ma +1 zimą
    # i +2 latem, więc zadanie jest ustawione na obie godziny UTC każdej pory (zimą i latem
    # jedna z nich wypada o pełnej godzinie w Warszawie). GitHub nie gwarantuje godziny —
    # uruchomienia z harmonogramu bywają opóźnione o kilka godzin albo pomijane — dlatego
    # każde uruchomienie synchronizuje (bez sprawdzania godziny). Przy braku zmian niczego
    # nie zapisuje.
    # Zapis z uruchomień cyklicznych tylko, gdy w gcalsync.config.json jest "auto_apply": true.
    - cron: "0 4,5,10,11,16,17,22,23 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Zapisz zmiany w kalendarzu (odznaczone = tylko dry-run)"
        type: boolean
        default: false
      allow_mass_delete:
        description: "Pozwól na zapis mimo bezpiecznika masowego usuwania"
        type: boolean
        default: false
      restore_deleted:
        description: "Przywróć zajęcia usunięte ręcznie z kalendarza (razem z zapisem)"
        type: boolean
        default: false

concurrency:
  group: gcalsync
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # tylko do podtrzymania harmonogramu (ostatni krok)

jobs:
  sync:
    runs-on: ubuntu-latest
    # Z ponowieniami po awarii ewig (2 × 10 min przerwy) uruchomienie może trwać dłużej.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: |
          python -m pip install --quiet uv
          uv sync --frozen --no-dev

      - name: Synchronizacja
        env:
          EWIG_LOGIN: ${{ secrets.EWIG_LOGIN }}
          EWIG_PASSWORD: ${{ secrets.EWIG_PASSWORD }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          MODE: ${{ github.event_name == 'schedule' && '--apply-if-enabled' || (inputs.apply && '--apply' || '') }}
          MASS: ${{ inputs.allow_mass_delete && '--allow-mass-delete' || '' }}
          RESTORE: ${{ inputs.restore_deleted && '--restore-deleted' || '' }}
          # Uruchomienia z harmonogramu: gdy ewig nie działa, jeszcze 2 próby co 10 minut;
          # awaria krótsza niż doba od ostatniej udanej synchronizacji nie jest błędem (bez e-maila).
          OUTAGE: ${{ github.event_name == 'schedule' && '--ewig-retries 2 --ewig-retry-wait 600 --tolerate-ewig-outage 24' || '' }}
        run: uv run --frozen --no-dev gcalsync auto $MODE $MASS $RESTORE $OUTAGE --save-dir run-output --summary "$GITHUB_STEP_SUMMARY"

      - name: Pliki z ewig i dziennik (7 dni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcalsync-${{ github.run_id }}
          path: run-output
          retention-days: 7
          if-no-files-found: ignore

      # W publicznym repo GitHub wyłącza harmonogram po 60 dniach bez aktywności w repo.
      # Ponowne „włączenie” workflow przez API zeruje ten licznik — bez sztucznych commitów.
      - name: Podtrzymanie harmonogramu
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --silent -X PUT "repos/$REPO/actions/workflows/sync.yml/enable"
