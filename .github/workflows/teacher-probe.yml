name: Zwiad - plan prowadzącego (tymczasowy)
on:
  push:
    branches: [claude/lucid-pasteur-mpziiy]
    paths: [".github/probe/**", ".github/workflows/teacher-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --quiet uv
          uv sync --frozen --no-dev
      - env:
          EWIG_LOGIN: ${{ secrets.EWIG_LOGIN }}
          EWIG_PASSWORD: ${{ secrets.EWIG_PASSWORD }}
        run: uv run --frozen --no-dev python .github/probe/teacher_probe.py
