[project]
name = "gcalsync"
version = "0.1.0"
description = "Synchronizacja planu zajęć WAT (CSV z ewig) z Google Calendar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # zoneinfo na Windows nie ma systemowej bazy stref czasowych i korzysta z tego pakietu.
    "tzdata",
]

[project.scripts]
gcalsync = "gcalsync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcalsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Komunikaty i komentarze są po polsku; RUF001-003 zgłaszają „niejednoznaczne” znaki Unicode.
ignore = ["RUF001", "RUF002", "RUF003"]
